# Rate limiting lives in the application, where it can be scoped to a token and a
# plan. This zone is only a coarse backstop against a single address saturating the
# FPM pool before PHP gets a chance to throttle it.
limit_req_zone $binary_remote_addr zone=perip:10m rate=100r/s;

upstream php {
    server app:9000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location = /robots.txt  { access_log off; log_not_found off; return 200 "User-agent: *\nDisallow: /\n"; }

    # FPM's own status and ping endpoints must never be reachable from outside.
    location ~ ^/(fpm-status|fpm-ping)$ {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=perip burst=200 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Only the front controller is executable. Without this, any uploaded or
        # stray .php file under public/ would run.
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
