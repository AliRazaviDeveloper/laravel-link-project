openapi: 3.1.0

info:
  title: Shortwave API
  version: "1.0.0"
  summary: Link shortening with a click-intelligence spine.
  description: |
    Shortwave turns long URLs into short ones and reports on what happens to them.

    ## How to read this document

    Two surfaces, with different rules:

    - **`/api/v1/*`** — the management API. Bearer-token authenticated, JSON in and out,
      rate limited per token according to the account's plan.
    - **`/{slug}`** — the public redirect. Unauthenticated, answers `302`, and is the only
      endpoint an end user's browser ever touches. It is documented here because its
      status codes are part of the contract.

    ## Errors

    Every failure is an [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem
    document with `Content-Type: application/problem+json`. The `type` member is stable
    and machine-readable; `detail` is prose and may be reworded without notice. Write
    error handling against `type`, never against `detail` or the HTTP status alone.

    Responses carry an `X-Request-Id` header. Supply your own to trace a request across
    services; it is echoed back and appears in the server logs for that request.

    ## Click counts are approximate

    Redirects increment a counter in memory rather than the database row, and a
    reconciliation job folds the totals in every minute. `click_count` therefore
    reflects everything served, but the split between the stored total and the buffer is
    an implementation detail that can lag by up to a minute. Treat it as a metric, not a
    ledger.

    ## Retrying safely

    `POST`, `PATCH` and `DELETE` accept an `Idempotency-Key` header. A repeated request
    with the same key and body returns the original response with
    `Idempotent-Replay: true` instead of acting twice — which is what makes a retry after
    a timeout safe.

  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080
    description: Local development stack
  - url: https://api.shortwave.dev
    description: Production

tags:
  - name: Authentication
    description: Registration, login and API tokens.
  - name: Links
    description: Creating and managing short links.
  - name: Analytics
    description: Reporting on click traffic.
  - name: Redirect
    description: The public endpoint that serves short links.
  - name: Operations
    description: Health and readiness.

security:
  - bearerAuth: []

paths:

  /api/v1/health:
    get:
      tags: [Operations]
      summary: Check every backing service
      description: |
        Probes PostgreSQL, MongoDB and Redis, and reports all three even when one has
        already failed. Answers `503` when any check fails, so an orchestrator pulls the
        instance out of rotation rather than sending it traffic it cannot serve.
      operationId: health
      security: []
      responses:
        "200":
          description: Every dependency is reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Create an account
      description: |
        Creates a free-plan account and issues its first token. The plaintext token is
        returned **once**, on this response only; the server keeps a hash.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409":
          description: That address is already registered.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: https://shortwave.dev/problems/email_already_registered
                title: Conflict
                status: 409
                detail: The email "owner@example.com" is already registered.
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Exchange credentials for a token
      description: |
        A wrong password and an unknown address produce the same `401` with the same
        detail, deliberately, so this endpoint cannot be used to discover which addresses
        hold accounts.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated; a new token was issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Describe the authenticated account
      operationId: me
      responses:
        "200":
          description: The account behind the presented token.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current token
      description: |
        Revokes only the token that made the request. The account's other tokens keep
        working, so signing out of one client does not sign out the rest.
      operationId: logout
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/links:
    get:
      tags: [Links]
      summary: List links
      operationId: listLinks
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/LinkStatus" }
        - name: search
          in: query
          description: Matches a slug prefix, a title, or a destination host.
          schema: { type: string, maxLength: 120 }
        - name: sort_by
          in: query
          description: Restricted to an allowlist; anything else is rejected.
          schema:
            type: string
            enum: [created_at, updated_at, click_count, slug]
            default: created_at
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: A page of links.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

    post:
      tags: [Links]
      summary: Create a link
      description: |
        Omit `slug` to have one generated. Supply it for a vanity link — it is lower-cased
        before storage, because these strings get transcribed by hand from print and
        screenshots.

        Destinations must be publicly routable `http`/`https` URLs. Loopback, RFC 1918,
        link-local and cloud-metadata hosts are refused at write time, so a short link
        can never be used to reach somewhere the caller could not reach directly.
      operationId: createLink
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLinkRequest" }
      responses:
        "201":
          description: Link created. `Location` carries the short URL.
          headers:
            Location:
              description: The short URL for the new link.
              schema: { type: string, format: uri }
            Idempotent-Replay:
              description: Present and `true` when this is a replay of an earlier request.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The token lacks `links:write`, or the plan's link allowance is used up.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: https://shortwave.dev/problems/link_allowance_exceeded
                title: Plan Limit Reached
                status: 403
                detail: The free plan allows 50 links and 50 are already in use.
                plan: free
                allowance: 50
                used: 50
        "409": { $ref: "#/components/responses/SlugTaken" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/links/import:
    post:
      tags: [Links]
      summary: Create many links at once
      description: |
        Partial success is the contract. Each row is created independently and reported
        on individually, so one bad URL in a batch of two hundred does not discard the
        rest.

        A mixed batch answers **207**, not 201, so a client cannot read a flat `2xx` as
        "everything landed". A batch where nothing was created answers 422.

        Requires a paid plan.
      operationId: importLinks
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "201":
          description: Every row was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "207":
          description: Some rows were created and some were rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Nothing was created, the batch was malformed, or the plan forbids import.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/links/{link}:
    parameters:
      - $ref: "#/components/parameters/LinkId"

    get:
      tags: [Links]
      summary: Fetch one link
      operationId: showLink
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LinkNotFound" }

    patch:
      tags: [Links]
      summary: Update a link
      description: |
        A partial update. Fields you omit keep their current value; fields you send as
        `null` are cleared — that is how an expiry date or a click cap is removed.

        The slug is immutable: changing it would break every already-shared copy of the
        link. Create a new link instead.
      operationId: updateLink
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLinkRequest" }
      responses:
        "200":
          description: The updated link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LinkNotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

    delete:
      tags: [Links]
      summary: Archive a link
      description: |
        Archives rather than deletes. The link stops resolving and its click history is
        kept — a hard delete would orphan analytics that nothing could label afterwards.
        Reversible with the restore endpoint.
      operationId: archiveLink
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: "Archived, or already archived." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LinkNotFound" }

  /api/v1/links/{link}/restore:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    post:
      tags: [Links]
      summary: Restore an archived link
      operationId: restoreLink
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The restored link, resolving again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LinkNotFound" }

  /api/v1/links/{link}/stats:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    get:
      tags: [Analytics]
      summary: Report on one link
      description: |
        Returns totals, a dense time series and per-dimension breakdowns.

        The series is **zero-filled**: every interval in the window is present, so the
        array can be charted directly instead of joining two distant points across an
        apparent gap.

        Bot traffic is excluded from `clicks` and reported separately in `bot_clicks`, so
        a crawler sweep does not read as a campaign spike.

        Reports are cached briefly. `meta.cached` tells you whether this response was
        computed or served from cache.
      operationId: linkStats
      parameters:
        - name: from
          in: query
          description: |
            Window start, inclusive. Defaults to 30 days ago. May not reach further back
            than the plan's analytics retention.

            Remember to URL-encode the `+` in a timezone offset, or send a `Z`-suffixed
            UTC timestamp.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Window end, exclusive. Defaults to now.
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          description: |
            Bucket size for the series. Each has a maximum window — hourly buckets are
            capped at 14 days — so a request that would return thousands of rows is
            refused rather than built.
          schema: { $ref: "#/components/schemas/Granularity" }
        - name: dimensions
          in: query
          description: Defaults to country, referrer and device type.
          explode: true
          schema:
            type: array
            maxItems: 5
            items: { $ref: "#/components/schemas/BreakdownDimension" }
        - name: limit
          in: query
          description: Rows per breakdown.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkStatsEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LinkNotFound" }
        "422":
          description: |
            The window reaches past the plan's retention, or the granularity would
            produce too many buckets for it.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: https://shortwave.dev/problems/invariant_violation
                title: Unprocessable Entity
                status: 422
                detail: Your plan retains 30 days of analytics; the requested window starts earlier.
                field: from

  /api/v1/overview:
    get:
      tags: [Analytics]
      summary: Summarise the account
      description: |
        One call across both stores: click totals and the busiest links come from the
        analytics store, the link inventory and plan allowance from the relational one.
      operationId: overview
      parameters:
        - name: days
          in: query
          description: Window length. Clamped to the plan's retention.
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverviewEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /{slug}:
    get:
      tags: [Redirect]
      summary: Follow a short link
      description: |
        The public endpoint. Answers `302`, never `301`: a permanent redirect is cached
        indefinitely by browsers and intermediaries, which would both prevent retargeting
        the link and make every later visit invisible to analytics.

        The distinction between `404` and `410` is deliberate. An archived link answers
        `404`, because archiving is reversible. An expired or exhausted link answers
        `410`, which tells crawlers to stop asking.
      operationId: followSlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{1,46}[a-z0-9]$" }
      responses:
        "302":
          description: Redirect to the destination.
          headers:
            Location:
              schema: { type: string, format: uri }
            Cache-Control:
              description: Always no-store, so every click is counted.
              schema: { type: string }
        "404":
          description: No such slug, or the link is archived.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: The link is past its expiry date or has reached its click limit.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: https://shortwave.dev/problems/link_not_resolvable
                title: Gone
                status: 410
                detail: This link has reached its click limit.
                slug: spring26
                reason: click_limit_reached
        "429": { $ref: "#/components/responses/RateLimited" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The plaintext token from register or login, sent as `Authorization: Bearer <token>`.

        Tokens carry abilities and endpoints check them: `links:read`, `links:write` and
        `analytics:read`. A token without the required ability gets `403`, which is how a
        CI job can hold a token that creates links but cannot read the account's traffic.

  parameters:
    LinkId:
      name: link
      in: path
      required: true
      description: The link's ULID.
      schema: { $ref: "#/components/schemas/Ulid" }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        An opaque, client-chosen value that makes this request replay-safe. Repeating it
        with the same body returns the original response instead of acting again.
      schema: { type: string, maxLength: 255 }

  responses:
    Unauthorized:
      description: No token, or a token that is invalid or revoked.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://shortwave.dev/problems/unauthenticated
            title: Unauthorized
            status: 401
            detail: A valid API token is required.

    Forbidden:
      description: The token lacks the ability this endpoint requires.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://shortwave.dev/problems/forbidden
            title: Forbidden
            status: 403
            detail: This token may not perform that action.

    LinkNotFound:
      description: |
        No such link. Also returned for a link owned by another account — confirming that
        an id exists is itself a leak, so the two cases are indistinguishable.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://shortwave.dev/problems/link_not_found
            title: Not Found
            status: 404
            detail: No link exists with id "01HQ8V3M9XKPWT7CZR4NFGD2AB".
            link_id: 01HQ8V3M9XKPWT7CZR4NFGD2AB

    SlugTaken:
      description: That slug is in use. The slug namespace is global across accounts.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://shortwave.dev/problems/slug_already_taken
            title: Conflict
            status: 409
            detail: The slug "spring26" is already in use.
            slug: spring26

    ValidationFailed:
      description: The payload failed validation, or a value broke a domain rule.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://shortwave.dev/problems/validation_failed
            title: Unprocessable Entity
            status: 422
            detail: The request payload failed validation.
            errors:
              destination_url: ["The destination url field is required."]

    RateLimited:
      description: Rate limit exceeded. The allowance depends on the account's plan.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://shortwave.dev/problems/rate_limited
            title: Too Many Requests
            status: 429
            detail: Rate limit exceeded; slow down and retry after the indicated delay.

  schemas:

    Ulid:
      type: string
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
      description: |
        A ULID. Sorts chronologically, which is why ids are safe to use as pagination
        tiebreaks and as time cursors.
      examples: ["01HQ8V3M9XKPWT7CZR4NFGD2AB"]

    Problem:
      type: object
      description: |
        An RFC 9457 problem document. Extra members vary by `type`.

        Any endpoint can also answer `500` with this shape. The detail is withheld
        deliberately in that case — driver errors and stack traces routinely carry
        credentials and internal hostnames — so quote `request_id` when reporting one.
      examples:
        - type: https://shortwave.dev/problems/internal_error
          title: Internal Server Error
          status: 500
          detail: An unexpected error occurred.
          request_id: 0f3a9c21-58ce-4a0e-9f54-6b1d7c2e8a90
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          description: Stable, machine-readable identifier for the failure. Branch on this.
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: Human-readable prose. Not stable; do not parse.
        request_id:
          type: string
          description: Matches the `X-Request-Id` header; quote it in a bug report.
      additionalProperties: true

    Plan:
      type: object
      required: [name, link_allowance, requests_per_minute, analytics_retention_days]
      properties:
        name: { type: string, enum: [free, pro, scale] }
        link_allowance: { type: integer }
        requests_per_minute: { type: integer }
        analytics_retention_days: { type: integer }

    Account:
      type: object
      required: [id, email, name, plan, created_at]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        email: { type: string, format: email }
        name: { type: string }
        plan: { $ref: "#/components/schemas/Plan" }
        created_at: { type: string, format: date-time }

    Token:
      type: object
      required: [id, name, value]
      properties:
        id: { type: string }
        name: { type: string }
        value:
          type: string
          description: |
            The plaintext token. Returned only on the response that created it — the
            server stores a hash and cannot show it again.
          examples: ["7|sw_9mKq2XpL0tVn4bR8cZ1yWd6fHj3sAe5G"]
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Null when the token does not expire, which is the default.

    Session:
      type: object
      required: [account, token]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        token: { $ref: "#/components/schemas/Token" }

    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 120 }
        password:
          type: string
          minLength: 12
          description: |
            At least 12 characters, and checked against known breach corpora.
        token_name:
          type: string
          maxLength: 60
          default: default
          description: A label for the token this creates, to tell your clients apart.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string }
        token_name: { type: string, maxLength: 60, default: default }

    LinkStatus:
      type: string
      enum: [active, archived]

    Link:
      type: object
      required:
        [id, slug, short_url, destination_url, status, resolvable, click_count, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        slug:
          type: string
          description: Always lower-case; comparison is case-insensitive.
        short_url: { type: string, format: uri }
        destination_url: { type: string, format: uri }
        title: { type: [string, "null"], maxLength: 160 }
        status: { $ref: "#/components/schemas/LinkStatus" }
        resolvable:
          type: boolean
          description: |
            Whether the link would serve a redirect right now. False for an archived,
            expired or exhausted link — a single flag so a client need not re-derive the
            rules from `status`, `expires_at` and `max_clicks`.
        expires_at: { type: [string, "null"], format: date-time }
        max_clicks: { type: [integer, "null"], minimum: 1 }
        click_count:
          type: integer
          description: |
            Total clicks served, including those still buffered in memory. Approximate by
            design; see the introduction.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LinkEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Link" }

    LinkPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Link" }
        meta:
          type: object
          required: [total, page, per_page, last_page, has_more]
          properties:
            total: { type: integer }
            page: { type: integer }
            per_page: { type: integer }
            last_page: { type: integer }
            has_more: { type: boolean }

    CreateLinkRequest:
      type: object
      required: [destination_url]
      properties:
        destination_url:
          type: string
          format: uri
          maxLength: 2048
          description: An absolute, publicly routable http or https URL.
          examples: ["https://laravel.com/docs/12.x/eloquent"]
        slug:
          type: [string, "null"]
          minLength: 3
          maxLength: 48
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*[A-Za-z0-9]$"
          description: Omit to have one generated. Lower-cased before storage.
        title: { type: [string, "null"], maxLength: 160 }
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Must be in the future.
        max_clicks:
          type: [integer, "null"]
          minimum: 1
          description: |
            Stop resolving after this many clicks. Capped links are not cached, so this
            costs a lookup per redirect.

    UpdateLinkRequest:
      type: object
      description: |
        Send only the fields you want to change. An explicit `null` clears a field; an
        omitted field is left alone.
      properties:
        destination_url: { type: string, format: uri, maxLength: 2048 }
        title: { type: [string, "null"], maxLength: 160 }
        expires_at: { type: [string, "null"], format: date-time }
        max_clicks: { type: [integer, "null"], minimum: 1 }

    ImportRequest:
      type: object
      required: [links]
      properties:
        links:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/CreateLinkRequest" }
        stop_on_first_error:
          type: boolean
          default: false
          description: |
            Abort the run on the first rejection. Rows already created are **not** rolled
            back, and the report still lists them.

    ImportReport:
      type: object
      required: [summary, results]
      properties:
        summary:
          type: object
          required: [created, rejected]
          properties:
            created: { type: integer }
            rejected: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [index, status]
            properties:
              index:
                type: integer
                description: Position in the submitted array, so results can be lined up with input.
              status: { type: string, enum: [created, rejected] }
              link: { $ref: "#/components/schemas/Link" }
              error:
                type: object
                properties:
                  code: { type: string }
                  detail: { type: string }
                additionalProperties: true

    Granularity:
      type: string
      enum: [hour, day, week, month]
      default: day

    BreakdownDimension:
      type: string
      enum: [country, referrer, browser, platform, device_type]

    ClickTotals:
      type: object
      required: [clicks, unique_visitors, bot_clicks, returning_share_percent]
      properties:
        clicks:
          type: integer
          description: Human clicks. Excludes bot traffic.
        unique_visitors:
          type: integer
          description: |
            Distinct visitors, counted with a daily rotating hash of IP prefix and
            User-Agent. Exact rather than estimated, and not comparable across days.
        bot_clicks: { type: integer }
        returning_share_percent:
          type: number
          format: float
          description: Repeat traffic as a share of human clicks.

    TimeBucket:
      type: object
      required: [starts_at, clicks, unique_visitors]
      properties:
        starts_at: { type: string, format: date-time }
        clicks: { type: integer }
        unique_visitors: { type: integer }

    BreakdownSlice:
      type: object
      required: [label, clicks, share_percent]
      properties:
        label:
          type: string
          description: |
            `direct` for clicks with no referrer, `unknown` where the dimension could not
            be determined.
        clicks: { type: integer }
        share_percent: { type: number, format: float }

    LinkStats:
      type: object
      required: [link_id, window, totals, series, breakdowns, meta]
      properties:
        link_id: { $ref: "#/components/schemas/Ulid" }
        window:
          type: object
          required: [from, until, granularity]
          properties:
            from: { type: string, format: date-time }
            until: { type: string, format: date-time }
            granularity: { $ref: "#/components/schemas/Granularity" }
        totals: { $ref: "#/components/schemas/ClickTotals" }
        peak:
          description: The busiest bucket, or null when the window holds no buckets.
          oneOf:
            - { $ref: "#/components/schemas/TimeBucketPeak" }
            - { type: "null" }
        series:
          type: array
          description: Dense — one entry per interval, zero-filled where nothing landed.
          items: { $ref: "#/components/schemas/TimeBucket" }
        breakdowns:
          type: object
          description: Keyed by dimension name.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/BreakdownSlice" }
        meta:
          type: object
          required: [cached]
          properties:
            cached:
              type: boolean
              description: Whether this report was served from cache rather than recomputed.

    TimeBucketPeak:
      type: object
      required: [starts_at, clicks]
      properties:
        starts_at: { type: string, format: date-time }
        clicks: { type: integer }

    LinkStatsEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/LinkStats" }

    Overview:
      type: object
      required: [window, totals, inventory, top_links]
      properties:
        window:
          type: object
          required: [from, until]
          properties:
            from: { type: string, format: date-time }
            until: { type: string, format: date-time }
        totals: { $ref: "#/components/schemas/ClickTotals" }
        inventory:
          type: object
          required: [links, link_allowance, allowance_used_percent]
          properties:
            links: { type: integer }
            link_allowance: { type: integer }
            allowance_used_percent: { type: number, format: float }
        top_links:
          type: array
          items:
            type: object
            required: [link_id, slug, clicks]
            properties:
              link_id: { $ref: "#/components/schemas/Ulid" }
              slug: { type: string }
              title: { type: [string, "null"] }
              clicks: { type: integer }

    OverviewEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Overview" }

    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok, latency_ms]
            properties:
              ok: { type: boolean }
              latency_ms: { type: number, format: float }
              error:
                type: string
                description: |
                  Exception class name only. Connection error messages routinely contain
                  credentials, so the message itself is withheld.
