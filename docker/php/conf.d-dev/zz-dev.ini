; Development overrides.
;
; The `zz-` prefix is load-bearing. PHP reads conf.d alphabetically and later files win,
; so a plain `dev.ini` is overridden by `opcache.ini` — which sets
; validate_timestamps=0 and would stop the container from ever noticing an edited file.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.jit=off
display_errors=Off
