[www]
listen = 9000
listen.backlog = 2048

pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

pm.status_path = /fpm-status
ping.path = /fpm-ping
