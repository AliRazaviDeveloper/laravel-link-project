user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The request id is generated here when a client did not supply one, so it is
    # present in the access log even for requests that never reach PHP.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$http_x_request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration_ms":$request_time,'
        '"upstream_ms":"$upstream_response_time",'
        '"referer":"$http_referer"'
    '}';

    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 16m;
    client_body_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json application/problem+json text/plain;

    include /etc/nginx/conf.d/*.conf;
}
